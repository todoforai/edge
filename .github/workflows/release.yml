name: Build and Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64
            bun_target: ""
          - os: ubuntu-22.04
            target: linux-arm64
            bun_target: "--target=bun-linux-arm64"
          - os: macos-latest
            target: macos-arm64
            bun_target: ""
          - os: macos-latest
            target: macos-x64
            bun_target: "--target=bun-darwin-x64"
          - os: windows-latest
            target: windows-x64
            bun_target: ""

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Checkout shared packages
      run: git clone --depth 1 https://x-access-token:${{ secrets.GH_PAT }}@github.com/todoforai/packages.git ../packages

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2

    - name: Install dependencies
      # The shared packages are cloned OUTSIDE this checkout, so the hoist into
      # bun/node_modules is invisible to them — their own file: deps must be installed
      # in place or the bundler can't resolve @shared/* / ws from their sources.
      shell: bash
      run: |
        cd bun && bun install
        (cd ../../packages/shared-api && bun install)

    - name: Compile standalone binary
      shell: bash
      run: |
        cd bun
        # Burn the released version into the binary (tag vXX.YY.ZZ → XX.YY.ZZ; fallback: package.json)
        if [[ "${GITHUB_REF_NAME}" == v* ]]; then
          VERSION="${GITHUB_REF_NAME#v}"
        else
          VERSION=$(jq -r .version package.json)
        fi
        DEFINE=(--define "BUILD_VERSION=\"$VERSION\"")
        if [[ "${{ matrix.target }}" == windows-* ]]; then
          bun build src/index.ts --compile ${{ matrix.bun_target }} "${DEFINE[@]}" --outfile dist/todoforai-edge.exe
        else
          bun build src/index.ts --compile ${{ matrix.bun_target }} "${DEFINE[@]}" --outfile dist/todoforai-edge
        fi

    - name: Package artifact
      shell: bash
      run: |
        mkdir -p release
        if [[ "${{ matrix.target }}" == windows-* ]]; then
          cp bun/dist/todoforai-edge.exe release/todoforai-edge-${{ matrix.target }}.exe
        else
          cp bun/dist/todoforai-edge release/todoforai-edge-${{ matrix.target }}
          chmod +x release/todoforai-edge-${{ matrix.target }}
        fi

    # Unsigned Windows exes get flagged by SmartScreen and most AV engines.
    # Same Azure Trusted Signing account/profile as bridge + the tauri app.
    # NOTE: needs bun >= 1.2.23 — before that, appending the Authenticode
    # signature corrupted --compile binaries (oven-sh/bun#22960).
    - name: Sign with Azure Trusted Signing
      if: matrix.target == 'windows-x64'
      shell: pwsh
      env:
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      run: |
        cargo install trusted-signing-cli --version 0.11.0 --locked
        $exe = "release/todoforai-edge-windows-x64.exe"
        trusted-signing-cli -e "${{ secrets.AZURE_SIGNING_ENDPOINT }}" -a "${{ secrets.AZURE_SIGNING_ACCOUNT }}" -c "${{ secrets.AZURE_SIGNING_PROFILE }}" -d TODOforAI $exe
        if ($LASTEXITCODE -ne 0) { Write-Error "signing failed"; exit 1 }
        # Prove the signature landed
        $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
          Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
        & $signtool verify /pa /v $exe
        if ($LASTEXITCODE -ne 0) { Write-Error "exe is not signed"; exit 1 }
        # Signing rewrites the bytes -> the exe must still run
        & $exe --version
        if ($LASTEXITCODE -ne 0) { Write-Error "signed exe is broken"; exit 1 }

    - name: Compute sha256
      shell: bash
      run: |
        cd release
        for f in $(ls); do
          if command -v sha256sum >/dev/null; then sha256sum "$f" > "$f.sha256"
          else shasum -a 256 "$f" > "$f.sha256"; fi
        done
        cat *.sha256

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: todoforai-edge-${{ matrix.target }}
        path: release/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Collect release files
      run: |
        mkdir -p release
        find artifacts -type f -exec cp {} release/ \;
        ls -la release/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: release/*
        generate_release_notes: true
